name: Build mobile apps & check tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.28.0'

    - name: Cache Flutter pub
      uses: actions/cache@v3
      with:
        path: ~/.pub-cache
        key: pub-cache-${{ hashFiles('pubspec.lock') }}

    - name: Cache Gradle
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/*.kt', '**/*.kts') }}

    - name: Flutter clean
      run: flutter clean

    - name: Install dependencies
      run: flutter pub get

    - name: Generate l10n
      run: flutter gen-l10n

    - name: Build APK
      run: flutter build apk

    - name: Build AppBundle
      run: flutter build appbundle


  build-ios:
    name: Build iOS
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.28.0'

    - name: Install dependencies
      run: flutter pub get

    - name: Generate l10n
      run: flutter gen-l10n

    - name: Cache Pods
      uses: actions/cache@v3
      with:
        path: ios/Pods
        key: pods-${{ hashFiles('ios/Podfile.lock') }}

    - name: Build iOS (No Code Sign)
      run: flutter build ios --release --no-codesign


  check-tests:
    name: Run Flutter Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.28.0'

    - name: Cache Flutter pub
      uses: actions/cache@v3
      with:
        path: ~/.pub-cache
        key: pub-cache-${{ hashFiles('pubspec.lock') }}

    - name: Flutter doctor
      run: flutter doctor

    - name: Install dependencies
      run: flutter pub get

    - name: Generate l10n
      run: flutter gen-l10n

    - name: Run tests
      run: flutter test
